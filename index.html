<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome — Dishakkshi &amp; Kartikay</title>
<meta name="theme-color" content="#efe8d9">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<link rel="stylesheet" href="src/css/style.css?v=11">
</head>
<body>

<main class="ec">
  <img class="ec-ganesh" src="resources/images/ganesh2_cutout.png" alt="Shree Ganesha">
  <p class="ec-welcome">Kalpana Singh &amp; Mahendra Singh cordially invite you to the engagement ceremony of their beloved daughter</p>

  <p class="ec-names">Dr. Dishakkshi &amp; Kartikay</p>

  <div class="ec-rule"><span>&#9825;</span></div>

  <p class="ec-date">Sunday, 6th December 2026</p>
  <p class="ec-venue">DNG Grand, Kanpur</p>

  <div class="ec-mono">
    <img src="resources/images/logo_no_bg.png" alt="D and K monogram">
  </div>

  <div class="ec-rule"><span>&#9825;</span></div>

  <div class="ec-countdown" id="ec-countdown">
    <div class="ec-cd-cell"><span id="ec-cd-d">--</span><label>Days</label></div>
    <div class="ec-cd-sep">:</div>
    <div class="ec-cd-cell"><span id="ec-cd-h">--</span><label>Hours</label></div>
    <div class="ec-cd-sep">:</div>
    <div class="ec-cd-cell"><span id="ec-cd-m">--</span><label>Mins</label></div>
    <div class="ec-cd-sep">:</div>
    <div class="ec-cd-cell"><span id="ec-cd-s">--</span><label>Secs</label></div>
  </div>
</main>

<script src="src/js/script.js?v=1"></script>

</body>
</html>
