<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engagement Dinner — Dishakkshi &amp; Kartikay</title>
<meta name="description" content="Please join us as we celebrate the engagement dinner of Dishakkshi &amp; Kartikay, Friday 11 December 2026, IIDM Resort, Lucknow.">
<meta name="theme-color" content="#0a0b0c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="src/css/style.css?v=1">
</head>
<body>

<main class="ei">
  <div class="ei-scrim" aria-hidden="true"></div>

  <div class="ei-inner">
    <p class="ei-kicker ei-seq ei-seq-1">Please join us as we celebrate<br>engagement dinner of</p>

    <div class="ei-mono-wrap ei-seq ei-seq-2">
      <p class="ei-names-behind">
        <span>Dishakkshi</span>
        <span>Kartikay</span>
      </p>
      <p class="ei-mono" aria-hidden="true">
        <span class="mono-d">D</span><span class="mono-k">K</span>
      </p>
    </div>
    <div class="ei-rule ei-seq ei-seq-3"></div>

    <div class="ei-date ei-seq ei-seq-4">
      <p class="ei-date-month">December</p>
      <div class="ei-date-row">
        <span class="ei-date-line"></span>
        <span class="ei-date-day">
          <em>Friday</em>
          <strong>11</strong>
          <em>at 8 PM</em>
        </span>
        <span class="ei-date-line"></span>
      </div>
      <p class="ei-date-year">2026</p>
    </div>
    <div class="ei-rule ei-seq ei-seq-5"></div>

    <p class="ei-venue ei-seq ei-seq-5">IIDM Resort, Lucknow</p>
    <div class="ei-rule ei-rule-sm ei-seq ei-seq-6"></div>
    <p class="ei-rsvp ei-seq ei-seq-6">Please RSVP by 1 December</p>

    <p class="ei-sign ei-seq ei-seq-7">With love, D &amp; K</p>
  </div>
</main>

<script src="src/js/script.js?v=1"></script>
</body>
</html>
